[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-memory-mcp"
version = "3.0.0rc1"
description = "Local single-tenant MCP memory, handoffs and verified backups"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
embeddings = ["fastembed"]

[project.scripts]
unified-memory-mcp = "server:main"
unified-memory-gateway = "gateway:main"
unified-memory-admin = "memory_admin:main"
unified-memory-demo = "memory_demo:main"

[tool.setuptools]
py-modules = ["server", "gateway", "memory_admin", "memory_transfer", "memory_demo"]
